{% include base_path %}
<div class="pp">
{% for g in site.data.people %}
  <div class="pp__group pp__group--{{ g.people.size }}">
    <h3 class="pp__label">{{ g.group }}</h3>
    <ul class="pp__list">
    {% for p in g.people %}
      <li class="pp__card"><a href="{{ p.url }}"><img src="{{ base_path }}/images/people/{{ p.photo }}" alt="{{ p.name }}" loading="lazy" width="240" height="300"><span class="pp__name">{% if p.title %}{{ p.title }} {% endif %}{{ p.name }}</span><span class="pp__role">{{ p.role }}</span></a></li>
    {% endfor %}
    </ul>
  </div>
{% endfor %}
</div>
