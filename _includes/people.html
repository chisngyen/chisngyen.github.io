{% include base_path %}
<h3 class="pp__label">Advisor and mentors</h3>
<ul class="pp-m">
{% for p in site.data.people.mentors %}
  <li><a class="pp-m__card" href="{{ p.url }}"><img src="{{ base_path }}/images/people/{{ p.photo }}" alt="{{ p.name }}" loading="lazy" width="240" height="300"><span class="pp-m__text"><span class="pp-m__role">{{ p.role }}</span><span class="pp__name">{{ p.name }}</span><span class="pp__org">{{ p.org }}</span></span></a></li>
{% endfor %}
</ul>
<h3 class="pp__label">Teammates at HCMUS</h3>
<ul class="pp-t">
{% for p in site.data.people.team %}
  <li><a class="pp-t__card" href="{{ p.url }}"><img src="{{ base_path }}/images/people/{{ p.photo }}" alt="{{ p.name }}" loading="lazy" width="240" height="300"><span class="pp__name">{{ p.name }}</span></a></li>
{% endfor %}
</ul>
